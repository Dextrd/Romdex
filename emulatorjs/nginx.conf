server {
    listen 8080;
    root /usr/share/nginx/html;

    # The cores are big and never change within a version, so browsers keep them.
    location / {
        add_header Cache-Control "public, max-age=604800";
        add_header Cross-Origin-Resource-Policy "same-origin";
    }

    location = /health {
        access_log off;
        return 200 "ok\n";
    }
}
