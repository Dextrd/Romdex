<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <title>Romdex</title>
    <base href="/" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="css/app.css" />
    <script src="js/theme.js"></script>
</head>

<body>
    <div id="app">
        <div class="boot loading"><span class="spinner"></span> Loading Romdex…</div>
    </div>

    <div id="blazor-error-ui" role="alert">
        <div class="error-line">
            <span>Something went wrong<span class="error-says">: <span class="error-message"></span></span>.</span>
            <button type="button" class="error-toggle link" aria-expanded="false">Details</button>
            <a href="." class="reload">Reload</a>
            <button type="button" class="dismiss link" aria-label="Dismiss">✕</button>
        </div>
        <div class="error-more">
            <pre class="error-details"></pre>
            <p>The app may go on working; reloading starts it afresh. This is in the server's log too.
                <button type="button" class="error-copy link">Copy</button></p>
        </div>
    </div>
    <!-- Plain names: the core publishes this page as is, without filling in fingerprint placeholders. -->
    <script src="js/clipboard.js"></script>
    <script src="js/errors.js"></script>
    <script src="js/scroll.js"></script>
    <script src="js/flip.js"></script>
    <script src="js/attempts.js"></script>
    <script src="js/topbar.js"></script>
    <script src="js/cover.js"></script>
    <script src="js/game.js"></script>
    <script src="js/carousel.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
