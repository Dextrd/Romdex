# Builds the images from this checkout instead of pulling releases:
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up --build
services:
  core:
    image: romdex-core:dev
    build:
      context: .
      dockerfile: docker/core.Dockerfile
  igir-worker:
    image: romdex-igir-worker:dev
    build: igir-worker
  emulatorjs:
    image: romdex-emulatorjs:dev
    build: emulatorjs
